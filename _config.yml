# ------------------------------------------------------------
# Technical settings — no need to change
# ------------------------------------------------------------
markdown: kramdown
permalink: /blog/:year/:month/:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }
exclude:
  - HOW-TO-UPDATE.md
  - README.md
  - Gemfile
